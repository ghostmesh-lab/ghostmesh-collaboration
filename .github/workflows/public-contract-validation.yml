name: Public contract validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    name: offline-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.1'
      - name: Install pinned validation library
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0 cryptography==46.0.5
      - name: Validate public contract and synthetic reference
        env:
          GH_PR_METADATA_JSON: ${{ toJSON(github.event.pull_request) }}
        run: |
          python tools/validate_public_research.py
          python tools/verify_bundle.py
          python tools/check_publication.py
          python tools/check_pr_metadata.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/test_node_attestation.mjs
          python tools/evaluate_stale_truth.py > /dev/null

  public-security-screen:
    name: public-security-screen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Screen public files for known sensitive patterns
        run: |
          python tools/public_content_screen.py
          python tests/test_public_screen.py
